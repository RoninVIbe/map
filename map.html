<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Карта маршрута</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
</head>
<body>
  <div id="map"></div>
  <button id="li" onclick="goBack()" style="position:absolute;top:10px;right: 10px;z-index:1000;">Назад</button>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  <script>
    const stops = [
      { id: 1, name: "Астана Нурлы жол", lat: 51.128, lng: 71.430 },
      { id: 2, name: "Байтерек", lat: 51.128, lng: 71.438 },
      { id: 3, name: "Хан Шатыр", lat: 51.132, lng: 71.445 },
      { id: 4, name: "Университет", lat: 51.136, lng: 71.455 },
      { id: 5, name: "Экспо", lat: 51.140, lng: 71.468 },
    ];

    const startId = parseInt(localStorage.getItem("startId"));
    const endId = parseInt(localStorage.getItem("endId"));

    const startStop = stops.find(s => s.id === startId);
    const endStop = stops.find(s => s.id === endId);

    const map = L.map('map').setView([51.13, 71.44], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    if (startStop && endStop) {
      const control = L.Routing.control({
        waypoints: [
          L.latLng(startStop.lat, startStop.lng),
          L.latLng(endStop.lat, endStop.lng)
        ],
        router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
        createMarker: function(i, wp) {
          return L.marker(wp.latLng).bindPopup(i === 0 ? startStop.name : endStop.name);
        },
        addWaypoints: false,
        routeWhileDragging: false,
        show: false
      }).addTo(map);

      // Убираем панель инструкций
      setTimeout(() => {
        const panel = document.querySelector(".leaflet-routing-container");
        if (panel) panel.style.display = "none";
      }, 500);
    }

    function goBack() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
