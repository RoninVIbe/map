<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Выбор маршрута</title>
  <link rel="website icon" type="png" href="https://ru.pinterest.com/pin/10907224091665253/">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Выберите маршрут</h1>

    <label for="start">Начальная точка</label>
    <select id="start"></select>

    <label for="end">Конечная точка</label>
    <select id="end"></select>

    <button onclick="saveSelection()">Показать маршрут</button>
  </div>

  <script>
    const stops = [
      { id: 1, name: "Астана Нурлы жол" },
      { id: 2, name: "Байтерек" },
      { id: 3, name: "Хан Шатыр" },
      { id: 4, name: "Университет" },
      { id: 5, name: "Экспо" }
    ];

    const startSelect = document.getElementById("start");
    const endSelect = document.getElementById("end");

    stops.forEach(stop => {
      startSelect.add(new Option(stop.name, stop.id));
      endSelect.add(new Option(stop.name, stop.id));
    });

    function saveSelection() {
      const start = startSelect.value;
      const end = endSelect.value;
      if (start === end) {
        alert("Начальная и конечная точка совпадают!");
        return;
      }

      localStorage.setItem("startId", start);
      localStorage.setItem("endId", end);
      window.location.href = "map.html";
    }
  </script>
</body>
</html>
